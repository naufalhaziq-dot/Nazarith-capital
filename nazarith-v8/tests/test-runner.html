<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NAZARITH CAPITAL V8.0 — In-Browser Test Suite Runner</title>
  <style>
    body {
      background: #080b10;
      color: #e8edf5;
      font-family: monospace;
      padding: 30px;
    }
    h1 { color: #9dbbd8; font-size: 20px; border-bottom: 1px solid #253242; padding-bottom: 10px; }
    .badge { padding: 3px 8px; border-radius: 3px; font-weight: bold; font-size: 11px; }
    .pass { background: #12382e; color: #53c99a; border: 1px solid #28684f; }
    .fail { background: #3a1a1f; color: #ee7777; border: 1px solid #713b43; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
    th, td { border: 1px solid #253242; padding: 10px; text-align: left; }
    th { background: #101721; color: #8294aa; }
    tr:hover { background: #111a26; }
  </style>
  <script src="../assets/js/calculations.js"></script>
  <script src="calculations.test.js"></script>
</head>
<body>
  <h1>NAZARITH CAPITAL V8.0 — AUTOMATED QUANTITATIVE TESTS</h1>
  <div id="summary" style="margin: 15px 0; font-size: 14px;">Running test assertions...</div>
  <table>
    <thead>
      <tr>
        <th>STATUS</th>
        <th>TEST ASSERTION NAME</th>
        <th>EXPECTED</th>
        <th>ACTUAL</th>
      </tr>
    </thead>
    <tbody id="testTableBody"></tbody>
  </table>

  <script>
    const results = window.TradingTests.runAllTests();
    const passedCount = results.filter(r => r.passed).length;
    const totalCount = results.length;

    const summaryEl = document.getElementById('summary');
    summaryEl.innerHTML = `
      Result: <b style="color:${passedCount === totalCount ? '#53c99a' : '#ee7777'}">${passedCount} / ${totalCount} PASSED</b>
      ${passedCount === totalCount ? '— All institutional trading formulas verified mathematically.' : ''}
    `;

    const bodyEl = document.getElementById('testTableBody');
    bodyEl.innerHTML = results.map(r => `
      <tr>
        <td><span class="badge ${r.passed ? 'pass' : 'fail'}">${r.passed ? 'PASS' : 'FAIL'}</span></td>
        <td><b>${r.testName}</b></td>
        <td>${JSON.stringify(r.expected)}</td>
        <td>${JSON.stringify(r.actual)}</td>
      </tr>
    `).join('');
  </script>
</body>
</html>
